name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest
      - name: CLI smoke test
        shell: bash
        run: |
          reconcileai demo --out ci_demo --orders 300
          reconcileai validate ci_demo/data/bank_statement.csv
          reconcileai run --orders ci_demo/data/orders.xlsx --bank ci_demo/data/bank_statement.xlsx --output ci_reports --formats xlsx,csv,json
          reconcileai evaluate ci_demo/ground_truth.json --min-precision 0.99
          test -s ci_reports/reconciliation_report.xlsx
